<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Overview | Apex Workspace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="brand-container">
            <img src="logo.png" alt="ApexWorkspace" class="brand-logo-img" onerror="this.src='https://via.placeholder.com/120x40/6366f1/ffffff?text=ApexWorkspace'">
            <h2>Super Admin Dashboard</h2>
        </div>

        <nav class="admin-nav-links" id="adminNavLinks">
            <a href="admin-dashboard.html" class="active">Overview</a>
            <a href="employees.html">Employee Provisioning</a>
            <a href="chats.html">Client Chats</a>
        </nav>

        <div class="user-profile">
            <span>Logged in: <strong id="userProfileName">Super Admin</strong></span>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <h4>Total Active Employees</h4>
                <p class="stat-number" id="dashEmpCount">0</p>
            </div>
            <div class="stat-card">
                <h4>Active Client Accounts</h4>
                <p class="stat-number">12</p>
            </div>
            <div class="stat-card">
                <h4>System Security Status</h4>
                <p class="stat-number" style="color: #10b981;">RBAC Active</p>
            </div>
        </div>

        <section class="dashboard-panel">
            <div class="panel-header">
                <h3>⚡ Live Employee Work Activity Logs</h3>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Employee Name</th>
                        <th>Project / Client</th>
                        <th>Current Task</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="liveActivityTable">
                    <!-- Populated by script.js -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
